<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — wdps</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='8' y='13' font-family='Menlo, Consolas, monospace' font-size='11' text-anchor='middle' fill='%23c9a25e'>w</text></svg>" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('wdps-theme') || 'dark';
  </script>
  <style>
    :root {
      --bg:     #1b1b18;
      --fg:     #b8b5a9;
      --dim:    #6e6b60;
      --border: #3a3a34;
      --amber:  #c9a25e;
      --cyan:   #7a9e9f;
      --font-mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    :root[data-theme="light"] {
      --bg:     #e6dcc4;
      --fg:     #4a4436;
      --dim:    #8c8168;
      --border: #c2b493;
      --amber:  #8a6420;
      --cyan:   #46707a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.7;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    ::selection { background: var(--amber); color: var(--bg); }
    a { color: var(--amber); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 0.2em; }
    .panel {
      border: 1px solid var(--border);
      padding: 2rem 2.25rem;
      max-width: 34rem;
      width: 100%;
      text-align: center;
    }
    .code {
      color: var(--amber);
      font-size: 2rem;
      letter-spacing: 0.1em;
    }
    .cursor {
      margin-left: 0.5ch;
      animation: blink 1.2s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .message { margin-top: 0.75rem; }
    .dim { color: var(--dim); }
    .back { margin-top: 1.5rem; }
    .key { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="panel">
    <p class="code">404<span class="cursor" aria-hidden="true">█</span></p>
    <p class="message">nothing here.</p>
    <p class="dim message">the page you're looking for doesn't exist, or moved.</p>
    <p class="back"><a href="/" id="back-link"><span class="key" aria-hidden="true">[↵]</span> back to wdps</a></p>
  </div>
  <script>
    // Same plain keydown pattern as shortcuts.ts, kept inline since this
    // page is served standalone (outside the app bundle) and can't rely
    // on Vite-processed asset paths.
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Enter') window.location.href = '/';
    });
  </script>
</body>
</html>
